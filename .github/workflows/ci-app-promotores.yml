name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Build de produção com valores fictícios: o app só aponta para a API simulada.
      - run: npm run build
        env:
          FIU_FIU_API_BASE_URL: http://localhost:4010
          BASE_URL: http://localhost:4010
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
          NEXT_TELEMETRY_DISABLED: "1"

      - run: npx playwright install --with-deps chromium

      # CI=true faz o playwright.config.ts usar `next start` (build de produção).
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
